name: CI

on:
  pull_request:
  push:
    branches: [main, fraudshield/main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          # Same version as local, so the format check matches.
          flutter-version: 3.47.4
          channel: stable
          cache: true

      - name: Install packages
        run: flutter pub get

      - name: Format
        run: dart format --output=none --set-exit-if-changed lib test integration_test

      - name: Analyze
        run: flutter analyze

      - name: Test with coverage
        run: flutter test --coverage

      - name: Coverage gate (70%)
        run: |
          total=$(grep -h '^LF:' coverage/lcov.info | cut -d: -f2 | paste -sd+ | bc)
          hit=$(grep -h '^LH:' coverage/lcov.info | cut -d: -f2 | paste -sd+ | bc)
          pct=$(( 100 * hit / total ))
          echo "Line coverage: ${pct}%"
          if [ "$pct" -lt 70 ]; then
            echo "Coverage is below 70%"
            exit 1
          fi
