name: fraud_shield
description: FraudShield - real-time fraud alerts, instant blocking and dispute management (Flutter Banking Capstone P10).
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.7.0

# No backend to install: the bank server runs inside the app
# (lib/mock_server). local_auth gives the real fingerprint / face check on
# phones; see android/ and ios/ for its small platform setup.
dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  dio: ^5.7.0
  local_auth: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
